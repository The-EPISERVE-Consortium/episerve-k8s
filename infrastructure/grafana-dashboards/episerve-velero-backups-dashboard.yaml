apiVersion: v1
kind: ConfigMap
metadata:
  name: episerve-velero-backups-dashboard
  namespace: kube-prometheus
  labels:
    grafana_dashboard: "1"
data:
  episerve-velero-backups-dashboard.json: |
    {
      "uid": "episerve-velero-backups",
      "title": "EPISERVE Velero Backups",
      "tags": ["episerve", "velero", "backups"],
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            }
          },
          {
            "name": "schedule",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(velero_backup_last_status{schedule!=\"\"}, schedule)",
            "refresh": 1,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Backup Location Available",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 5, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "velero_backup_location_status_gauge{backup_location_name=\"default\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": { "text": "Available", "color": "green" },
                    "0": { "text": "Unavailable", "color": "red" }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "id": 2,
          "title": "Existing Backups",
          "type": "stat",
          "gridPos": { "x": 5, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "velero_backup_total",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "id": 3,
          "title": "Last Backup Status",
          "type": "stat",
          "gridPos": { "x": 9, "y": 0, "w": 7, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "velero_backup_last_status{schedule!=\"\", schedule=~\"$schedule\"}",
              "instant": true,
              "legendFormat": "{{schedule}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": { "text": "Success", "color": "green" },
                    "0": { "text": "Failure", "color": "red" }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "id": 4,
          "title": "Last Successful Backup Age",
          "type": "stat",
          "gridPos": { "x": 16, "y": 0, "w": 8, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - velero_backup_last_successful_timestamp{schedule!=\"\", schedule=~\"$schedule\"}",
              "instant": true,
              "legendFormat": "{{schedule}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 172800 },
                  { "color": "red", "value": 691200 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "id": 5,
          "title": "Backup Results",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(velero_backup_success_total{schedule!=\"\", schedule=~\"$schedule\"}[7d])",
              "legendFormat": "{{schedule}} success"
            },
            {
              "refId": "B",
              "expr": "increase(velero_backup_failure_total{schedule!=\"\", schedule=~\"$schedule\"}[7d])",
              "legendFormat": "{{schedule}} failed"
            },
            {
              "refId": "C",
              "expr": "increase(velero_backup_partial_failure_total{schedule!=\"\", schedule=~\"$schedule\"}[7d])",
              "legendFormat": "{{schedule}} partial"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "drawStyle": "line"
              }
            }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "id": 6,
          "title": "Backup Warnings and Item Errors",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "velero_backup_warning_total{schedule!=\"\", schedule=~\"$schedule\"}",
              "legendFormat": "{{schedule}} warnings"
            },
            {
              "refId": "B",
              "expr": "velero_backup_items_errors{schedule!=\"\", schedule=~\"$schedule\"}",
              "legendFormat": "{{schedule}} item errors"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "drawStyle": "line"
              }
            }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "id": 7,
          "title": "Backup Duration",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "velero_backup_duration_seconds_sum{schedule!=\"\", schedule=~\"$schedule\"} / clamp_min(velero_backup_duration_seconds_count{schedule!=\"\", schedule=~\"$schedule\"}, 1)",
              "legendFormat": "{{schedule}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "drawStyle": "line"
              }
            }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "id": 8,
          "title": "Items Backed Up",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "velero_backup_items_total{schedule!=\"\", schedule=~\"$schedule\"}",
              "legendFormat": "{{schedule}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "drawStyle": "line"
              }
            }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "id": 9,
          "title": "Backup Metadata Tarball Size",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 20, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "velero_backup_tarball_size_bytes{schedule!=\"\", schedule=~\"$schedule\"}",
              "legendFormat": "{{schedule}}"
            }
          ],
          "description": "This is the Velero metadata tarball size, not total object-store usage.",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "drawStyle": "line"
              }
            }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "id": 10,
          "title": "Kopia Storage Transfer",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 20, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(kopia_blob_upload_bytes_total[6h])",
              "legendFormat": "uploaded bytes"
            },
            {
              "refId": "B",
              "expr": "increase(kopia_blob_download_full_blob_bytes_total[6h]) + increase(kopia_blob_download_partial_blob_bytes_total[6h])",
              "legendFormat": "downloaded bytes"
            }
          ],
          "description": "Transfer activity seen by Kopia. This is not current repository size.",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "drawStyle": "line"
              }
            }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "id": 11,
          "title": "Kopia Storage Errors",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 28, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(kopia_blob_errors_total[6h])",
              "legendFormat": "{{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "drawStyle": "line"
              }
            }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "id": 12,
          "title": "Repository Maintenance Duration",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 28, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "velero_repo_maintenance_duration_seconds_sum / clamp_min(velero_repo_maintenance_duration_seconds_count, 1)",
              "legendFormat": "{{repository_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "drawStyle": "line"
              }
            }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "id": 13,
          "title": "Velero Deployment Availability",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 36, "w": 8, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"velero\", deployment=~\"velero|snapshot-controller\"}",
              "legendFormat": "{{deployment}} available"
            },
            {
              "refId": "B",
              "expr": "kube_deployment_spec_replicas{namespace=\"velero\", deployment=~\"velero|snapshot-controller\"}",
              "legendFormat": "{{deployment}} desired"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "drawStyle": "line"
              }
            }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "id": 14,
          "title": "Velero Node-Agent Ready",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 36, "w": 8, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_daemonset_status_number_ready{namespace=\"velero\", daemonset=\"node-agent\"}",
              "legendFormat": "ready"
            },
            {
              "refId": "B",
              "expr": "kube_daemonset_status_desired_number_scheduled{namespace=\"velero\", daemonset=\"node-agent\"}",
              "legendFormat": "desired"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "drawStyle": "line"
              }
            }
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "id": 15,
          "title": "Velero Scrape Up",
          "type": "stat",
          "gridPos": { "x": 16, "y": 36, "w": 8, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "up{namespace=\"velero\", service=\"velero\"}",
              "instant": true,
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": { "text": "Up", "color": "green" },
                    "0": { "text": "Down", "color": "red" }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        }
      ]
    }
