apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - listenerset.yaml
  - listenerset-acme.yaml
  - httproute.yaml
  - certificate.yaml
  - referencegrant.yaml
  - trafficpolicy.yaml
replacements:
  - source:
      kind: ConfigMap
      name: gateway-config
      fieldPath: data.hostname
    targets:
      - select:
          kind: ListenerSet
          name: listeners
        fieldPaths:
          - spec.listeners.0.hostname
      - select:
          kind: ListenerSet
          name: acme-listeners
        fieldPaths:
          - spec.listeners.0.hostname
      - select:
          kind: HTTPRoute
          name: route
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Certificate
          name: tls
        fieldPaths:
          - spec.dnsNames.0
  - source:
      kind: ConfigMap
      name: gateway-config
      fieldPath: data.secretName
    targets:
      - select:
          kind: ListenerSet
          name: listeners
        fieldPaths:
          - spec.listeners.0.tls.certificateRefs.0.name
      - select:
          kind: Certificate
          name: tls
        fieldPaths:
          - spec.secretName
      - select:
          kind: ReferenceGrant
          name: tls-grant
        fieldPaths:
          - spec.to.0.name
  - source:
      kind: ConfigMap
      name: gateway-config
      fieldPath: data.serviceName
    targets:
      - select:
          kind: HTTPRoute
          name: route
        fieldPaths:
          - spec.rules.0.backendRefs.0.name
  - source:
      kind: ConfigMap
      name: gateway-config
      fieldPath: data.servicePort
    targets:
      - select:
          kind: HTTPRoute
          name: route
        fieldPaths:
          - spec.rules.0.backendRefs.0.port
  - source:
      kind: ConfigMap
      name: gateway-config
      fieldPath: data.listenerName
    targets:
      - select:
          kind: HTTPRoute
          name: route
        fieldPaths:
          - spec.parentRefs.0.name
  - source:
      kind: ConfigMap
      name: gateway-config
      fieldPath: data.routeName
    targets:
      - select:
          kind: TrafficPolicy
          name: zib-only
        fieldPaths:
          - spec.targetRefs.0.name
