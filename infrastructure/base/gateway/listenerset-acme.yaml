apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: acme-listeners
spec:
  parentRef:
    kind: Gateway
    group: gateway.networking.k8s.io
    name: shared-public-gateway
    namespace: kgateway-system
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: GATEWAY_HOSTNAME
      name: http
      port: 80
      protocol: HTTP
      