apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: listeners
spec:
  parentRef:
    kind: Gateway
    group: gateway.networking.k8s.io
    name: shared-public-gateway
    namespace: kgateway-system
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: GATEWAY_HOSTNAME
      name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: GATEWAY_SECRET_NAME
            kind: Secret
            