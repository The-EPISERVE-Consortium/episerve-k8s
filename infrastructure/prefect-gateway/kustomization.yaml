apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../base/gateway
  - trafficpolicy.yaml
replacements:
  - source:
      kind: ConfigMap
      name: gateway-config
      fieldPath: data.hostname
    targets:
      - select:
          kind: ListenerSet
          name: gateway-listeners
        fieldPaths:
          - spec.listeners.0.hostname
      - select:
          kind: ListenerSet
          name: gateway-acme-listeners
        fieldPaths:
          - spec.listeners.0.hostname
      - select:
          kind: HTTPRoute
          name: gateway-route
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Certificate
          name: gateway-tls
        fieldPaths:
          - spec.dnsNames.0
  - source:
      kind: ConfigMap
      name: gateway-config
      fieldPath: data.secretName
    targets:
      - select:
          kind: ListenerSet
          name: gateway-listeners
        fieldPaths:
          - spec.listeners.0.tls.certificateRefs.0.name
      - select:
          kind: Certificate
          name: gateway-tls
        fieldPaths:
          - spec.secretName
      - select:
          kind: ReferenceGrant
          name: gateway-tls-grant
        fieldPaths:
          - spec.to.0.name
  - source:
      kind: ConfigMap
      name: gateway-config
      fieldPath: data.serviceName
    targets:
      - select:
          kind: HTTPRoute
          name: gateway-route
        fieldPaths:
          - spec.rules.0.backendRefs.0.name
  - source:
      kind: ConfigMap
      name: gateway-config
      fieldPath: data.servicePort
    targets:
      - select:
          kind: HTTPRoute
          name: gateway-route
        fieldPaths:
          - spec.rules.0.backendRefs.0.port
configMapGenerator:
  - name: gateway-config
    literals:
      - hostname=prefect.episerve.zib.de
      - secretName=prefect-tls
      - serviceName=prefect-server
      - servicePort=4200