apiVersion: gateway.kgateway.dev/v1alpha1
kind: HTTPListenerPolicy
metadata:
  name: episerve-api-server-websocket
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: episerve-api-server-listeners
  upgradeConfig:
    enabledUpgrades:
      - websocket
