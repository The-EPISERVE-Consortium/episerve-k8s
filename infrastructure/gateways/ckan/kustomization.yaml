apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ckan
namePrefix: ckan-
components:
  - ../../base/gateway
  - ../../base/gateway-zib-only
configMapGenerator:
  - name: gateway-config
    literals:
      - hostname=ckan.episerve.zib.de
      - secretName=ckan-tls
      - serviceName=ckan
      - servicePort=80
      - listenerName=ckan-listeners
      - routeName=ckan-route
