apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: tcp-listeners
  namespace: default
spec:
  parentRef:
    kind: Gateway
    group: gateway.networking.k8s.io
    name: shared-public-gateway
    namespace: kgateway-system
  listeners:
    - name: doip
      port: 3567
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
  # No listener for the compat port (3568): it speaks a custom length-prefixed
  # JSON framing that no known client uses (not doipy/DOIP 2.0 text framing).
