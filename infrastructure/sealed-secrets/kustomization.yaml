apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: sealed-secrets
    repo: https://bitnami.github.io/sealed-secrets
    version: "2.18.5"
    releaseName: sealed-secrets
    namespace: kube-system
    valuesFile: values.yaml
    # Renders the chart's crds/ directory. Without this the SealedSecret CRD is
    # never applied, so a rebuilt cluster has the controller but no SealedSecret
    # kind and every apps/*/sealed-secret.yaml fails to apply.
    includeCRDs: true
