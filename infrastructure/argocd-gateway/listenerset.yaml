apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: argocd-listeners
  namespace: argocd
spec:
  parentRef:
    kind: Gateway
    group: gateway.networking.k8s.io
    name: shared-public-gateway
    namespace: kgateway-system
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: argok8.medicalbioinformatics.de
      name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: argo-tls
            kind: Secret
