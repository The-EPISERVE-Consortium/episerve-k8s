pvc:
  enabled: true
  size: "50Gi"
  storageClassName: "csi-cephfs-sc-hdd"
  accessmode: "ReadWriteMany"

ckan:
  siteUrl: "https://data.episerve.zib.de"
  sysadminName: "ckan_admin"
  sysadminEmail: "tofconrad@googlemail.com"
  siteTitle: "EpiServe Data Catalog"
  siteId: "episerve"
  storagePath: "/app/data"
  upload_enabled: "true"
  # Credentials are supplied via the ckancredentials SealedSecret; these placeholders
  # satisfy the chart's template rendering but are not applied to the cluster.
  sysadminPassword: "placeholder"
  sysadminApiToken: "placeholder"

  # Expose JWT and session secrets under the names the CKAN startup script expects.
  # Without these, start_ckan.sh auto-generates random secrets into production.ini,
  # causing a mismatch between token signing (env var) and verification (production.ini).
  extraEnv:
    - name: CKAN__UPLOAD__ADMIN__TYPES
      value: "image"
    - name: CKAN__UPLOAD__ADMIN__MIMETYPES
      value: "image/png image/gif image/jpeg"
    - name: JWT_ENCODE_SECRET
      valueFrom:
        secretKeyRef:
          name: session-secret
          key: jwt_encode
    - name: JWT_DECODE_SECRET
      valueFrom:
        secretKeyRef:
          name: session-secret
          key: jwt_decode
    - name: BEAKER_SESSION_SECRET
      valueFrom:
        secretKeyRef:
          name: session-secret
          key: session_secret

  liveness:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 6
    timeoutSeconds: 15
  readiness:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 6
    timeoutSeconds: 15

  psql:
    # DB initialisation is handled by bootstrap/ckan/run-bootstrap.sh, not the chart job.
    # The psql-init job reads PSQL_PASSWD directly from values (no secretKeyRef support),
    # so we disable it here to avoid committing passwords.
    initialize: false
    masterUser: postgres
    masterPassword: "placeholder"
    masterDatabase: postgres

  db:
    ckanDbUrl: postgres
    ckanDbName: ckan_default
    ckanDbUser: ckan_default
    ckanDbPassword: "placeholder"

  datastore:
    RwDbUrl: postgres
    RwDbName: datastore_default
    RwDbUser: datastorerw
    RwDbPassword: "placeholder"
    RoDbUrl: postgres
    RoDbName: datastore_default
    RoDbUser: datastorero
    RoDbPassword: "placeholder"

zookeeper:
  resources:
    limits:
      memory: 768Mi
    requests:
      memory: 512Mi

solr:
  image:
    registry: docker.io
    repository: bitnamilegacy/solr
    tag: 9.9.0-debian-12-r1
  # adminPassword must be a plain value (chart sets it directly as an env var in the CKAN
  # deployment — no secretKeyRef support). Generated by bootstrap/ckan/run-bootstrap.sh
  # and written here. Solr is not externally exposed.
  auth:
    adminPassword: "Wi0MG59ADVuoZqp74HTEJ1pauHIm8Fth"
  volumeClaimTemplates:
    storageSize: 8Gi

postgresql:
  persistence:
    size: 8Gi
  auth:
    existingSecret: ckan-db-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
    username: ckan_default
    database: ckan_default
    # Placeholders — ignored when existingSecret is set.
    postgresPassword: "placeholder"
    password: "placeholder"
