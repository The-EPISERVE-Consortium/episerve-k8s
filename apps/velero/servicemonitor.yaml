apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: velero
  namespace: velero
  labels:
    app.kubernetes.io/instance: velero
    app.kubernetes.io/name: velero
spec:
  endpoints:
    - interval: 30s
      path: /metrics
      port: http-monitoring
      scrapeTimeout: 10s
  selector:
    matchLabels:
      app.kubernetes.io/instance: velero
      app.kubernetes.io/name: velero
