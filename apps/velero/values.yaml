configuration:
  features: EnableCSI
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: episerve-backups
      config:
        region: default
        s3ForcePathStyle: "true"
        s3Url: https://rise-s3.zib.de
  volumeSnapshotLocation:
    - name: csi
      provider: csi

credentials:
  useSecret: true
  existingSecret: velero-s3-credentials

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.13.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

nodeAgent:
  enabled: true

extraObjects:
  # ── CKAN ─────────────────────────────────────────────────────────────────
  - apiVersion: velero.io/v1
    kind: Schedule
    metadata:
      name: daily-ckan
      namespace: velero
    spec:
      schedule: "0 2 * * *"
      template:
        includedNamespaces: ["ckan"]
        ttl: 336h      # 14 days
        snapshotVolumes: false
        defaultVolumesToFsBackup: true
        hooks:
          resources:
            - name: pg-dump
              includedNamespaces: ["ckan"]
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: postgresql
              pre:
                - exec:
                    container: postgresql
                    timeout: 10m
                    onError: Fail
                    command:
                      - /bin/bash
                      - -c
                      - pg_dumpall -U postgres | gzip > /bitnami/postgresql/velero-backup.sql.gz
              post:
                - exec:
                    container: postgresql
                    timeout: 1m
                    onError: Continue
                    command:
                      - /bin/bash
                      - -c
                      - rm -f /bitnami/postgresql/velero-backup.sql.gz

  - apiVersion: velero.io/v1
    kind: Schedule
    metadata:
      name: weekly-ckan
      namespace: velero
    spec:
      schedule: "0 4 * * 0"
      template:
        includedNamespaces: ["ckan"]
        ttl: 2160h     # 90 days
