server:
  env:
    - name: PREFECT_UI_API_URL
      value: "https://prefect.medicalbioinformatics.de/api"

postgresql:
  enabled: true
  auth:
    username: prefect
    database: prefect
    existingSecret: prefect-postgresql-credentials
    secretKeys:
      userPasswordKey: password

ingress:
  enabled: true
  className: nginx
  host:
    hostname: prefect.medicalbioinformatics.de
    path: /
    pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/whitelist-source-range: "130.73.0.0/16"
  tls: true
