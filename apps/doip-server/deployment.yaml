apiVersion: apps/v1
kind: Deployment
metadata:
  name: doip-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doip-server
  template:
    metadata:
      labels:
        app: doip-server
    spec:
      containers:
        - name: doip-server
          image: ghcr.io/the-episerve-consortium/episerve_doip_server:latest
          ports:
            - containerPort: 80
            - containerPort: 3567
          # Baseline 280-560 MiB, but storage_lakefs reads whole objects into memory: RSS peaked at
          # 17.6 GiB (2026-10-11). The 20Gi limit only stops one download from starving the node; lower it
          # (~2Gi) once objects are streamed. No CPU limit (peak ~325m), to avoid throttling.
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 20Gi
          # HTTP gateway (uvicorn, the container's main process) serves the landing page on /.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          # The DOIP TCP server runs as a background process; if it dies, the container keeps
          # running on uvicorn alone. This restarts it when port 3567 stops accepting connections.
          livenessProbe:
            tcpSocket:
              port: 3567
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          env:
            - name: LAKEFS_URL
              value: "https://lake-episerve.zib.de"
            - name: LAKEFS_REPOS
              value: "data-processed,model-runs,models,benchmarks"
            - name: LAKEFS_USER
              valueFrom:
                secretKeyRef:
                  name: lakefs-credentials
                  key: lakefs-access-key
            - name: LAKEFS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lakefs-credentials
                  key: lakefs-secret-key
            - name: CORS_ALLOWED_ORIGINS
              value: "https://data.episerve.zib.de"
            # Verifies expiring links to restricted files (created by the CKAN theme).
            # Must equal DOIP_LINK_SECRET on CKAN. Optional: unset = signed links are refused.
            - name: DOIP_LINK_SECRET
              valueFrom:
                secretKeyRef:
                  name: doip-link-secret
                  key: doip-link-secret
                  optional: true
